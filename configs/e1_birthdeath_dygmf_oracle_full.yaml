# E1 ablation: DyG-MF with every node updated (mu = 1, like "w/o SEU"), k_mode=oracle, on a seeded
# 6-community induced subsample of the repo's Birth-Death instance (design log E3).
name: e1_birthdeath_dygmf_oracle_full
method: dygmf_lookahead
graph_seed: 1
algo_seed: 1
tracker_threshold: 0.3
event_tolerance: 1
event_min_overlap: 0.5
method_params:
  k_mode: oracle
  r: 20
  landmark_fraction: 0.5
  mu: 1.0
  lam: 0.2
  beta: 20.0
  s: 1
  n_iter: 100
data:
  source: birthdeath
  path: external/DyG-MF/Dirth-Death
  n_communities: 6
